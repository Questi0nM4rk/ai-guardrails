name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (biome)
        run: bun run lint

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run semgrep
        run: |
          pip install semgrep
          semgrep --config auto --error --exclude tests/

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary (needed for E2E tests)
        run: bun run build

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          bun test --coverage --coverage-threshold=85 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Publish badges
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          out="$RUNNER_TEMP/badges"; mkdir -p "$out"
          badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$2" "$3" "$4" > "$out/$1.json"; }
          pass=$(grep -Eo '^ *[0-9]+ pass' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          fail=$(grep -Eo '^ *[0-9]+ fail' "$log" | tail -1 | grep -Eo '[0-9]+' || echo 0)
          color=brightgreen; if [ "$fail" != 0 ] || [ "$pass" = 0 ]; then color=red; fi
          badge tests tests "$pass passed, $fail failed" "$color"
          bun run build:hk-cc
          bench=$(bun bench/hook-corpus.ts 2>&1 | grep -Eo 'caught [0-9]+/[0-9]+, false asks [0-9]+/[0-9]+' | tail -1)
          badge catch catch-rate "$(echo "$bench" | grep -Eo 'caught [0-9]+/[0-9]+' | cut -d" " -f2) dangerous caught" orange
          badge falseasks false-asks "$(echo "$bench" | grep -Eo 'asks [0-9]+/[0-9]+' | cut -d" " -f2) benign" blue
          cd "$out"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
