# Release workflow — triggered on tag push matching v*
#
# Stages the version in the npm stage queue with trusted publishing (OIDC from
# this workflow). No npm token exists anywhere; the trusted publisher on
# npmjs.com names release.yml and is stage-only. A maintainer approves the
# staged version on npmjs.com (2FA) before it is live.
#
# Release process:
#   1. Bump "version" in package.json
#   2. git commit the bump
#   3. git tag -a vX.Y.Z -m "vX.Y.Z"
#   4. git push origin main && git push origin vX.Y.Z   (the tag triggers this workflow)

name: Release

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases
      id-token: write # needed for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history needed for changelog generation

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Version mismatch: tag=$TAG, package.json=$PKG"
            exit 1
          fi

      - name: Build host binaries (E2E tests need dist/ai-guardrails)
        run: bun run build:all

      - name: Run tests
        run: bun test

      - name: Build cross-platform binaries (3 binaries × 4 targets)
        run: |
          set -e
          for TARGET in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            # main CLI
            bun build src/cli.ts --compile --bytecode --production \
              --target=bun-${TARGET} \
              --outfile dist/ai-guardrails-${TARGET}
            # hk + hk-cc-tools (helper script generates wrapper + cross-compiles)
            bun scripts/build-hk-binaries.ts ${TARGET} dist
          done

      - name: Compute checksums
        run: |
          cd dist
          sha256sum ai-guardrails*-* > checksums.sha256
          cat checksums.sha256

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-decorate)
          else
            CHANGES=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi
          echo "$CHANGES" > /tmp/changelog.md

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@^11.15.0 # npm stage needs npm 11.15.0 or newer

      - name: Stage on npm
        run: npm stage publish --tag beta --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/changelog.md \
            dist/ai-guardrails-linux-x64 \
            dist/ai-guardrails-linux-arm64 \
            dist/ai-guardrails-darwin-x64 \
            dist/ai-guardrails-darwin-arm64 \
            dist/ai-guardrails-hk-linux-x64 \
            dist/ai-guardrails-hk-linux-arm64 \
            dist/ai-guardrails-hk-darwin-x64 \
            dist/ai-guardrails-hk-darwin-arm64 \
            dist/ai-guardrails-hk-cc-tools-linux-x64 \
            dist/ai-guardrails-hk-cc-tools-linux-arm64 \
            dist/ai-guardrails-hk-cc-tools-darwin-x64 \
            dist/ai-guardrails-hk-cc-tools-darwin-arm64 \
            dist/checksums.sha256
